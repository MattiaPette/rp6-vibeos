# Waydroid lists the device nodes to pass into the container when it starts,
# and only passes /dev/kgsl-3d0 if it exists then. The msm GPU binds late
# (it waits for its firmware), so give it up to 15 s.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /dev/kgsl-3d0 ] && [ $i -lt 75 ]; do sleep 0.2; i=$((i+1)); done; true'
